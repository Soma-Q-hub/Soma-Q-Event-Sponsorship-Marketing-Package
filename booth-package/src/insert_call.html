<text x="68" y="178" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#FEFCF8">Every path starts</text><text x="68" y="238" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#FEFCF8">with a conversation.</text>

<text x="66" y="364" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">Health</text>
<text x="66" y="394" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">Sleep that doesn’t restore you, and</text><text x="66" y="414" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">a body that has been running on</text><text x="66" y="434" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">alarm for too long.</text>
<rect x="431" y="312" width="379" height="138" rx="18" fill="#EEEADD"/>
<text x="457" y="364" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">Wealth</text>
<text x="457" y="394" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">Money and business decisions made</text><text x="457" y="414" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">from pressure instead of clarity.</text>
<rect x="40" y="462" width="379" height="138" rx="18" fill="#EEEADD"/>
<text x="66" y="514" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">Relationships</text>
<text x="66" y="544" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">Less patience for the people you</text><text x="66" y="564" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">love than you give everyone else.</text>
<rect x="431" y="462" width="379" height="138" rx="18" fill="#EEEADD"/>
<text x="457" y="514" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">Career</text>
<text x="457" y="544" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">Leading well on the outside while</text><text x="457" y="564" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="14.5" fill="#24211D">running on empty on the inside.</text>

<text x="370" y="820" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="16" fill="#E4F2F2">We look at what pressure is costing you</text><text x="370" y="844" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="16" fill="#E4F2F2">right now and whether this work is the</text><text x="370" y="868" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="16" fill="#E4F2F2">right fit, with no obligation to go further.</text>
