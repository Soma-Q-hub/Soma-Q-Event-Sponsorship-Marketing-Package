<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Luggage tag front, black tag, vertical logo with website QR, 2.5 x 3.75 in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Luggage tag front only (the back is a mesh window for a paper insert). Trim 2.5 x 3.75 in, file 2.75 x 4.0 in (0.125 in bleed). PLACEHOLDER size: match the vendor's die line, corner radius and hole. Black tag: print white and Light Teal inks. The QR links to soma-q.com and is about 0.78 in: test-scan a printed proof. */
@page { size: 2.75in 4.0in; margin: 0; }
html, body { margin: 0; padding: 0; width: 2.75in; height: 4.0in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 2.75in; height: 4.0in; }
</style></head><body>
<svg class="page" viewBox="0 0 275 400" xmlns="http://www.w3.org/2000/svg">
<rect width="275" height="400" fill="#111111"/>
<circle cx="137.5" cy="46" r="14" fill="none" stroke="#9BC4BD" stroke-width="1.2" stroke-dasharray="3 3"/><image href="{{QMARK_DARK_URI}}" x="89.5" y="68" width="96" height="98.4" preserveAspectRatio="xMidYMid meet"/>
<image href="{{WORDMARK_DARK_URI}}" x="69.5" y="178" width="136" height="25.1" preserveAspectRatio="xMidYMid meet"/>
<rect x="98.5" y="222" width="78" height="78" rx="5.5" fill="#FFFFFF" stroke="#103C41" stroke-width="1.0"/><svg x="105.5" y="229.0" width="64.0" height="64.0">{{QR_SITE}}</svg>
<text x="137.5" y="338" text-anchor="middle" font-family="DM Serif Display" font-size="24"><tspan fill="#9BC4BD">Shift </tspan><tspan fill="#FEFCF8">Happens</tspan><tspan fill="#FEFCF8" font-size="8" dy="-10">™</tspan></text>
<text x="137.5" y="364" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">Soma-<tspan fill="#9BC4BD">Q</tspan>.com</text>
</svg></body></html>
