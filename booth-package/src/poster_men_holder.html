<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Men's track poster: Hold space for others without losing touch with yourself</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file 24.25 x 36.25 in (0.125 in bleed). Units 0.01 in. Keep text 1.5 in inside the file edge. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#E4F2F2"/>
<polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">NERVOUS SYSTEM LITERACY</text>
<text x="175" y="560" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">Hold space for</text>
<text x="175" y="738" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">others without</text>
<text x="175" y="916" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">losing touch</text>
<text x="175" y="1094" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">with yourself.</text>
<text x="175" y="1270" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="54" fill="#24211D">Partners, colleagues and family bring you their feelings, and you carry them</text>
<text x="175" y="1338" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="54" fill="#24211D">well. Your own signals are often the quietest in the room, because many</text>
<text x="175" y="1406" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="54" fill="#24211D">men were never taught to listen for them.</text>
<text letter-spacing="9" x="175" y="1560" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="50" fill="#103C41">WHAT YOU CARRY</text>
<text letter-spacing="9" x="2250" y="1560" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="50" fill="#103C41">WHAT GOES QUIET</text>
<rect x="175" y="1620" width="760" height="130" rx="65" fill="#FEFCF8" stroke="#103C41" stroke-width="7"/>
<text x="250" y="1707" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Her stress</text>
<line x1="945" y1="1685" x2="1090" y2="1792" stroke="#103C41" stroke-width="12" stroke-linecap="round"/>
<rect x="175" y="1790" width="760" height="130" rx="65" fill="#FEFCF8" stroke="#103C41" stroke-width="7"/>
<text x="250" y="1877" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">The team's worry</text>
<line x1="945" y1="1855" x2="1090" y2="1852" stroke="#103C41" stroke-width="12" stroke-linecap="round"/>
<rect x="175" y="1960" width="760" height="130" rx="65" fill="#FEFCF8" stroke="#103C41" stroke-width="7"/>
<text x="250" y="2047" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">The family's needs</text>
<line x1="945" y1="2025" x2="1090" y2="1911" stroke="#103C41" stroke-width="12" stroke-linecap="round"/>
<rect x="175" y="2130" width="760" height="130" rx="65" fill="#FEFCF8" stroke="#103C41" stroke-width="7"/>
<text x="250" y="2217" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">A friend's hard week</text>
<line x1="945" y1="2195" x2="1090" y2="1971" stroke="#103C41" stroke-width="12" stroke-linecap="round"/>
<circle cx="1260" cy="1850" r="210" fill="#103C41"/><text x="1260" y="1905" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="150" fill="#FEFCF8">You</text>
<line x1="1480" y1="1850" x2="1830" y2="1850" stroke="#103C41" stroke-opacity=".5" stroke-width="8" stroke-dasharray="22 18"/>
<circle cx="2000" cy="1850" r="150" fill="#9BC4BD" fill-opacity=".35" stroke="#103C41" stroke-opacity=".6" stroke-width="7" stroke-dasharray="22 16"/>
<text x="2000" y="1840" text-anchor="middle" font-family="DM Sans" font-weight="500" font-size="50" fill="#103C41">Your own</text>
<text x="2000" y="1905" text-anchor="middle" font-family="DM Sans" font-weight="500" font-size="50" fill="#103C41">signal</text>
<text x="1212" y="2440" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="58" fill="#103C41" font-style="italic">Easy to miss when you are busy holding everything else.</text>
<line x1="175" y1="2560" x2="2250" y2="2560" stroke="#103C41" stroke-opacity=".28" stroke-width="8"/>
<text letter-spacing="9" x="250" y="2670" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="54" fill="#103C41">A 30-SECOND CHECK-IN</text>
<circle cx="305" cy="2790" r="55" fill="#103C41"/><text x="305" y="2812" text-anchor="middle" font-family="DM Serif Display" font-size="64" fill="#FEFCF8">1</text>
<text x="390" y="2800" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Feel your feet</text>
<text x="390" y="2870" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">on the floor.</text>
<circle cx="995" cy="2790" r="55" fill="#103C41"/><text x="995" y="2812" text-anchor="middle" font-family="DM Serif Display" font-size="64" fill="#FEFCF8">2</text>
<text x="1080" y="2800" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Find one place</text>
<text x="1080" y="2870" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">you feel something.</text>
<circle cx="1685" cy="2790" r="55" fill="#103C41"/><text x="1685" y="2812" text-anchor="middle" font-family="DM Serif Display" font-size="64" fill="#FEFCF8">3</text>
<text x="1770" y="2800" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Name it plainly:</text>
<text x="1770" y="2870" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">tight, hot, heavy.</text>
<text x="1212" y="2990" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="46" fill="#103C41" font-style="italic">So you can stay steady for the people who count on you, and know what is true for you.</text>
{{FOOTER:light:call}}
</svg></body></html>
