<div class="pg"><svg class="bk" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#103C41"/><image href="{{LOGO_DARK_URI}}" x="40.14" y="50" width="190" height="71" preserveAspectRatio="xMinYMid meet"/>
<text x="46" y="190" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="56" fill="#FEFCF8">What do you</text><text x="46" y="252" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="56" fill="#FEFCF8">do next?</text>
<text x="46" y="296" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="12.5" fill="#9BC4BD">A short guide to noticing pressure sooner,</text><text x="46" y="314" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="12.5" fill="#9BC4BD">and watching your progress in your own numbers.</text>
<g transform="translate(177,350) scale(0.25)">{{FIGURE:dark}}</g>
<text x="287.5" y="836" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="7.6" fill="#E4F2F2" letter-spacing="1">NERVOUS SYSTEM ALIGNMENT FOR HIGH-PERFORMING LEADERS</text>
</svg></div>
<div class="pg"><svg class="bk" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#EEEADD"/><text x="46" y="92" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41" letter-spacing="2.4">PRESSURE LANDS IN THE BODY FIRST</text>
<text x="46" y="164" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="42" fill="#103C41">Leadership does</text><text x="46" y="212" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="42" fill="#103C41">not happen from</text><text x="46" y="260" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="42" fill="#103C41">the neck up.</text>
<text x="46" y="330.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">Strategy matters. Emotional intelligence matters. But</text><text x="46" y="349.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">pressure lands in the body before it becomes the</text><text x="46" y="369.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">thought, the tone, the decision, or the reaction</text><text x="46" y="388.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">everyone else sees.</text>
<text x="46" y="430.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">When your body tightens and your mind speeds up,</text><text x="46" y="449.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">you can lose access to capabilities you already</text><text x="46" y="469.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">have. That is why more information rarely changes</text><text x="46" y="488.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">what happens in the hard moment. A trained</text><text x="46" y="508.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12.5" fill="#24211D">response does.</text>
<rect x="46" y="580" width="483" height="56" rx="12" fill="#103C41"/><circle cx="76" cy="608" r="14" fill="#9BC4BD"/><text x="76" y="614" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#103C41">1</text><text x="104" y="615" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#FEFCF8">Notice the signal.</text>
<rect x="46" y="650" width="483" height="56" rx="12" fill="#103C41"/><circle cx="76" cy="678" r="14" fill="#9BC4BD"/><text x="76" y="684" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#103C41">2</text><text x="104" y="685" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#FEFCF8">Locate what is happening.</text>
<rect x="46" y="720" width="483" height="56" rx="12" fill="#103C41"/><circle cx="76" cy="748" r="14" fill="#9BC4BD"/><text x="76" y="754" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#103C41">3</text><text x="104" y="755" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#FEFCF8">Choose your next response.</text>
<text x="287.5" y="842" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="9" fill="#5C5A53">2</text>
</svg></div>
<div class="pg"><svg class="bk" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#FFFFFF"/><text x="46" y="92" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41" letter-spacing="2.4">WHEN PRESSURE HITS</text>
<text x="46" y="150" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="38" fill="#103C41">Pressure happens.</text><text x="46" y="194" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="38" fill="#103C41">Then what?</text>
<g transform="translate(46,230) scale(0.172)"><circle cx="1400" cy="100" r="235" fill="#C9763F" fill-opacity=".20"/><circle cx="1400" cy="100" r="150" fill="#C9763F" fill-opacity=".22"/><rect x="900" y="0" width="1000" height="200" rx="100" fill="#FEFCF8" stroke="#103C41" stroke-width="10"/><text x="1400" y="132" text-anchor="middle" font-family="DM Serif Display" font-size="104" fill="#103C41">Pressure happens</text><path d="M1400,200 L1400,330" fill="none" stroke="#103C41" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1366,290 1434,290 1400,340" fill="#103C41"/><rect x="650" y="340" width="1500" height="400" rx="56" fill="#9BC4BD"/><text x="1400" y="462" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="92" fill="#103C41" letter-spacing="8">INTERRUPT HERE</text>
<text x="1400" y="560" text-anchor="middle" font-family="DM Sans" font-weight="400" font-size="66" fill="#103C41">Notice the signal. Locate it in your body.</text>
<text x="1400" y="680" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="84" fill="#103C41" font-style="italic">Do you catch it?</text>
<path d="M1000,740 L1000,820 L650,820 L650,930" fill="none" stroke="#103C41" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="616,890 684,890 650,940" fill="#103C41"/><path d="M1800,740 L1800,820 L2150,820 L2150,930" fill="none" stroke="#103C41" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><polygon points="2116,890 2184,890 2150,940" fill="#103C41"/><rect x="540" y="776" width="220" height="108" rx="54" fill="#FEFCF8" stroke="#103C41" stroke-width="10"/><text x="650" y="852" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="76" letter-spacing="6" fill="#103C41">NO</text><rect x="2040" y="776" width="220" height="108" rx="54" fill="#FEFCF8" stroke="#103C41" stroke-width="10"/><text x="2150" y="852" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="76" letter-spacing="6" fill="#103C41">YES</text><rect x="0" y="950" width="1300" height="1050" rx="60" fill="#103C41"/><text x="80" y="1090" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="124" fill="#FEFCF8">REACTION</text>
<text x="80" y="1170" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="70" fill="#9BC4BD">The loop runs again.</text>
<circle cx="112" cy="1324" r="16" fill="#C9763F"/><text x="160" y="1350" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#FEFCF8">Body tightens, mind races.</text>
<circle cx="112" cy="1494" r="16" fill="#C9763F"/><text x="160" y="1520" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#FEFCF8">Short with your people.</text>
<circle cx="112" cy="1664" r="16" fill="#C9763F"/><text x="160" y="1690" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#FEFCF8">Choices made from pressure.</text>
<circle cx="112" cy="1834" r="16" fill="#C9763F"/><text x="160" y="1860" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#FEFCF8">Running on empty.</text>
<rect x="1500" y="950" width="1300" height="1050" rx="60" fill="#FEFCF8" stroke="#103C41" stroke-width="12"/><text x="1580" y="1090" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="124" fill="#103C41">RESPONSE</text>
<text x="1580" y="1170" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="66" fill="#103C41">You choose what happens next.</text>
<circle cx="1612" cy="1324" r="16" fill="#9BC4BD" stroke="#103C41" stroke-width="5"/><text x="1660" y="1350" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#103C41">Body settles, mind clears.</text>
<circle cx="1612" cy="1494" r="16" fill="#9BC4BD" stroke="#103C41" stroke-width="5"/><text x="1660" y="1520" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#103C41">Present with your people.</text>
<circle cx="1612" cy="1664" r="16" fill="#9BC4BD" stroke="#103C41" stroke-width="5"/><text x="1660" y="1690" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#103C41">Choices made from clarity.</text>
<circle cx="1612" cy="1834" r="16" fill="#9BC4BD" stroke="#103C41" stroke-width="5"/><text x="1660" y="1860" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="79" fill="#103C41">Energy left at day’s end.</text>
</g>
<text x="46" y="640" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="14" fill="#24211D">The moment you notice the signal is the moment you can choose.</text><text x="46" y="661" text-anchor="start" font-family="DM Sans" font-weight="500" font-size="14" fill="#24211D">That is what we train.</text>
<text x="46" y="720.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#5C5A53">Left alone, running depleted starts to feel normal.</text><text x="46" y="737.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#5C5A53">It draws down your energy, narrows your thinking, and</text><text x="46" y="755.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#5C5A53">wears on your judgment.</text>
<text x="287.5" y="842" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="9" fill="#5C5A53">3</text>
</svg></div>
<div class="pg"><svg class="bk" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#103C41"/><text x="46" y="92" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#9BC4BD" letter-spacing="2.4">THE METHOD</text>
<text x="46" y="150" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="34" fill="#FEFCF8">Regulation is a skill.</text><text x="46" y="190" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="34" fill="#FEFCF8">Recovery is a skill.</text><text x="46" y="230" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="34" fill="#FEFCF8">Choice under pressure</text><text x="46" y="270" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="34" fill="#FEFCF8">is a skill.</text>
<text x="46" y="330" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="13" fill="#9BC4BD">And skills can be practiced, strengthened, and measured.</text>
<text x="46" y="392" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#9BC4BD" letter-spacing="2.4">PRESSURE SHOWS UP IN FOUR PLACES</text>
<rect x="46" y="412" width="237" height="176" rx="14" fill="#16494F"/><text x="64" y="456" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">Health</text>
<text x="64" y="486" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">Sleep that doesn’t</text><text x="64" y="503" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">restore you, and a body</text><text x="64" y="520" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">that has been running on</text><text x="64" y="537" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">alarm for too long.</text>
<rect x="292" y="412" width="237" height="176" rx="14" fill="#16494F"/><text x="310" y="456" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">Wealth</text>
<text x="310" y="486" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">Money and business</text><text x="310" y="503" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">decisions made from</text><text x="310" y="520" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">pressure instead of</text><text x="310" y="537" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">clarity.</text>
<rect x="46" y="600" width="237" height="176" rx="14" fill="#16494F"/><text x="64" y="644" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">Relationships</text>
<text x="64" y="674" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">Less patience for the</text><text x="64" y="691" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">people you love than you</text><text x="64" y="708" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">give everyone else.</text>
<rect x="292" y="600" width="237" height="176" rx="14" fill="#16494F"/><text x="310" y="644" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">Career</text>
<text x="310" y="674" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">Leading well on the</text><text x="310" y="691" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">outside while running on</text><text x="310" y="708" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#E4F2F2">empty on the inside.</text>
<text x="287.5" y="842" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="9" fill="#9BC4BD">4</text>
</svg></div>
<div class="pg"><svg class="bk" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#EEEADD"/><text x="46" y="92" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41" letter-spacing="2.4">WHAT MAKES SOMA-Q DIFFERENT</text>
<text x="46" y="150" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="33" fill="#103C41">The tools you practice</text><text x="46" y="189" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="33" fill="#103C41">also create the data.</text>
<text x="46" y="232" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="12.5" fill="#24211D">So we can see what is working, what is not, and adjust.</text>
<rect x="46" y="262" width="483" height="44" rx="10" fill="#FEFCF8"/><circle cx="68" cy="284" r="12" fill="#103C41"/><text x="68" y="289" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">1</text><text x="92" y="289" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="15" fill="#103C41">Baseline</text>
<text x="168" y="289" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Soma-Q Assessment at the start</text>
<rect x="46" y="314" width="483" height="44" rx="10" fill="#FEFCF8"/><circle cx="68" cy="336" r="12" fill="#103C41"/><text x="68" y="341" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">2</text><text x="92" y="341" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="15" fill="#103C41">Weekly</text>
<text x="168" y="341" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Soma-Q Weekly Check-In, under five minutes</text>
<rect x="46" y="366" width="483" height="44" rx="10" fill="#FEFCF8"/><circle cx="68" cy="388" r="12" fill="#103C41"/><text x="68" y="393" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">3</text><text x="92" y="393" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="15" fill="#103C41">Trended</text>
<text x="168" y="393" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">SQ-M and SQ-C, tracked separately</text>
<rect x="46" y="418" width="483" height="44" rx="10" fill="#FEFCF8"/><circle cx="68" cy="440" r="12" fill="#103C41"/><text x="68" y="445" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">4</text><text x="92" y="445" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="15" fill="#103C41">Report</text>
<text x="168" y="445" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Soma-Q Metrics Report, in plain language</text>
<rect x="46" y="470" width="483" height="44" rx="10" fill="#FEFCF8"/><circle cx="68" cy="492" r="12" fill="#103C41"/><text x="68" y="497" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">5</text><text x="92" y="497" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="15" fill="#103C41">Adjust</text>
<text x="168" y="497" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Practice follows the data</text>
<text x="46" y="548" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.2" fill="#103C41" letter-spacing="1.8">SQ-LPMS: ONE SYSTEM, TWO SEPARATE MEASURES</text>
<rect x="46" y="562" width="235" height="132" rx="14" fill="#FEFCF8"/><text x="62" y="586" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="7.8" fill="#103C41" letter-spacing="2">THE CAUSE</text>
<text x="62" y="622" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="26" fill="#103C41">SQ-M</text>
<text x="62" y="644" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Soma-Q Method Metrics.</text><text x="62" y="658" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Is the method landing in the</text><text x="62" y="672" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">body and nervous system?</text>
<rect x="294" y="562" width="235" height="132" rx="14" fill="#E4F2F2"/><text x="310" y="586" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="7.8" fill="#103C41" letter-spacing="2">THE EFFECT</text>
<text x="310" y="622" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="26" fill="#103C41">SQ-C</text>
<text x="310" y="644" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Soma-Q Leadership Competencies.</text><text x="310" y="658" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">Is the change showing up</text><text x="310" y="672" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.2" fill="#24211D">in how you lead?</text>
<text x="46" y="726" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">Kept apart on purpose, so a strong quarter of results</text><text x="46" y="743" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">cannot hide growing strain, and a slow start is not</text><text x="46" y="760" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">mistaken for a lack of capability.</text>
<text x="287.5" y="842" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="9" fill="#5C5A53">5</text>
</svg></div>

<text x="46" y="150" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">Example: a senior leader,</text><text x="46" y="186" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="30" fill="#103C41">16 weeks in.</text>
