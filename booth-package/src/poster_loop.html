<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: The Pressure Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file at 24.25 x 36.25 in (0.125 in bleed). Drawn in units of 0.01 in. Keep text 1.5 in inside the file edge.
   Print at FedEx, Staples or any poster printer; confirm their size and bleed requirements first. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
text { font-kerning: normal; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#EEEADD"/>
<polygon points="2425,3625 1500,3625 2425,2300" fill="#E4F2F2"/>
<g><polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">THE PRESSURE LOOP</text></g>
<text x="175" y="560" font-family="DM Serif Display" font-size="186" fill="#103C41">Pressure runs in a loop.</text>
<text x="175" y="765" font-family="DM Serif Display" font-size="186" fill="#103C41">It can be interrupted.</text>
<text x="175" y="960" font-family="DM Sans" font-size="58" fill="#24211D">When something stressful happens, your body and your mind</text>
<text x="175" y="1034" font-family="DM Sans" font-size="58" fill="#24211D">can feed each other without your noticing. Seeing the loop</text>
<text x="175" y="1108" font-family="DM Sans" font-size="58" fill="#24211D">is the first step to changing it.</text>
<g transform="translate(0,-110)">{{LOOP_SVG_LIGHT}}</g>
{{FOOTER:light}}
</svg></body></html>
