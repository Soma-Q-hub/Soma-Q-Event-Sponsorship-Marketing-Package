<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: The Pressure Loop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file 24.25 x 36.25 in (0.125 in bleed). Units 0.01 in. Keep text 1.5 in inside the file edge. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#EEEADD"/><polygon points="2425,3625 1500,3625 2425,2300" fill="#E4F2F2"/>
<polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">THE PRESSURE LOOP</text>
<text x="175" y="560" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">Interrupt the loop that</text>
<text x="175" y="738" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">drains your energy</text>
<text x="175" y="916" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">and clarity.</text>
<text x="175" y="1090" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">When something stressful happens, your body and mind can feed</text>
<text x="175" y="1160" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">each other without your noticing. Seeing the loop is the first step</text>
<text x="175" y="1230" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">to changing it.</text>
<g transform="translate(175,1300)">{{LOOP:light:gloss}}</g>
{{FOOTER:light}}
</svg></body></html>
