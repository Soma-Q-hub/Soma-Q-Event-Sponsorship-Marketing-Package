<svg class="page" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg">

<rect x="40" y="40" width="770" height="226" rx="22" fill="#103C41"/>

<text x="786" y="94" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="13" fill="#9BC4BD" letter-spacing="3">THE METHOD</text>
<text x="68" y="168" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="44" fill="#FEFCF8">Seven areas where body,</text><text x="68" y="219" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="44" fill="#FEFCF8">emotion, and thinking meet.</text>
<text x="68" y="246" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="17" fill="#9BC4BD">Each one tied to how you lead.</text>
<rect x="40" y="278" width="185" height="62" rx="12" fill="#E4F2F2"/><text x="54" y="302" font-family="DM Serif Display" font-size="17" fill="#103C41">1  Awareness</text><text x="54" y="324" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">Notice the signal early.</text>
<rect x="235" y="278" width="185" height="62" rx="12" fill="#E4F2F2"/><text x="249" y="302" font-family="DM Serif Display" font-size="17" fill="#103C41">2  Regulation</text><text x="249" y="324" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">Shift your state in the moment.</text>
<rect x="430" y="278" width="185" height="62" rx="12" fill="#E4F2F2"/><text x="444" y="302" font-family="DM Serif Display" font-size="17" fill="#103C41">3  Organization</text><text x="444" y="324" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">Build a steadier baseline.</text>
<rect x="625" y="278" width="185" height="62" rx="12" fill="#E4F2F2"/><text x="639" y="302" font-family="DM Serif Display" font-size="17" fill="#103C41">4  Integration</text><text x="639" y="324" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="11.5" fill="#24211D">Lead from it by default.</text>
<rect x="40" y="358" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="70" cy="390" r="15" fill="#103C41"/><text x="70" y="396" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">1</text><text x="96" y="396" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Foundation & Stability</text>
<text x="66" y="424" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Feel grounded and secure enough to</text><text x="66" y="442" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">make decisions without bracing for</text><text x="66" y="460" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">the worst.</text>
<rect x="431" y="358" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="461" cy="390" r="15" fill="#103C41"/><text x="461" y="396" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">2</text><text x="487" y="396" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Creativity & Connection</text>
<text x="457" y="424" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Think flexibly, generate fresh</text><text x="457" y="442" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">ideas, and stay connected to the</text><text x="457" y="460" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">people you lead.</text>
<rect x="40" y="478" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="70" cy="510" r="15" fill="#103C41"/><text x="70" y="516" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">3</text><text x="96" y="516" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Confidence & Drive</text>
<text x="66" y="544" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Act with steady confidence and hold</text><text x="66" y="562" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">clear boundaries without pushing</text><text x="66" y="580" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">yourself into depletion.</text>
<rect x="431" y="478" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="461" cy="510" r="15" fill="#103C41"/><text x="461" y="516" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">4</text><text x="487" y="516" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Compassion & Relationships</text>
<text x="457" y="544" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Stay open and steady in difficult</text><text x="457" y="562" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">conversations, so trust holds when</text><text x="457" y="580" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">the pressure is on.</text>
<rect x="40" y="598" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="70" cy="630" r="15" fill="#103C41"/><text x="70" y="636" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">5</text><text x="96" y="636" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Expression & Communication</text>
<text x="66" y="664" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Say what needs to be said clearly</text><text x="66" y="682" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">and calmly, even when the stakes</text><text x="66" y="700" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">are high.</text>
<rect x="431" y="598" width="379" height="110" rx="16" fill="#EEEADD"/><circle cx="461" cy="630" r="15" fill="#103C41"/><text x="461" y="636" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">6</text><text x="487" y="636" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Clarity & Intuition</text>
<text x="457" y="664" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">See a situation clearly and trust</text><text x="457" y="682" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">your read on it when the</text><text x="457" y="700" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">information is incomplete.</text>
<rect x="40" y="718" width="770" height="110" rx="16" fill="#EEEADD"/><circle cx="70" cy="750" r="15" fill="#103C41"/><text x="70" y="756" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">7</text><text x="96" y="756" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="20" fill="#103C41">Purpose & Perspective</text>
<text x="66" y="784" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">Keep the larger picture in view, so daily pressure stays connected to what</text><text x="66" y="802" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="13" fill="#24211D">matters most to you.</text>
<text x="40" y="850" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="13.5" fill="#103C41">The Soma-Q Assessment you complete when you begin shows which of these need attention first,</text>
<text x="40" y="870" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="13.5" fill="#103C41">so your practice is built for your system, not borrowed from someone else’s.</text>
<text x="40" y="930" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12" fill="#5C5A53">Built on research-supported practices for nervous system regulation.</text>
<rect x="40" y="956" width="770" height="104" rx="16" fill="#103C41"/>

<text x="220" y="1030" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="12.5" fill="#9BC4BD" letter-spacing="1">SOMA-Q.COM  ·  An honest conversation. No obligation.</text>
