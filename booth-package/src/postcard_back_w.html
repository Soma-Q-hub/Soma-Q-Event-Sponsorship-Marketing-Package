<!--/PHOTO--><text x="40" y="200" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="19" fill="#103C41">Megan McDonald</text>
<text x="40" y="215" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11" fill="#103C41" letter-spacing="1">Founder, Soma-Q</text>
<text x="40" y="230" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10" fill="#24211D">I led healthcare tech teams</text><text x="40" y="243" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10" fill="#24211D">until burnout and a health crisis</text><text x="40" y="256" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10" fill="#24211D">left me depleted, in pain and</text><text x="40" y="269" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10" fill="#24211D">unable to sleep.</text>
<text x="40" y="284.0" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="10" fill="#103C41">I rebuilt how I lead and live.</text><text x="40" y="297.5" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="10" fill="#103C41">Now I help leaders do the same.</text>
<line x1="212" y1="36" x2="212" y2="300" stroke="#103C41" stroke-width="8" stroke-opacity="0.2"/>
<text x="231" y="52" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="12" fill="#103C41" letter-spacing="1">HOW I WORK</text>
<rect x="228" y="68" width="3" height="52" fill="#9BC4BD"/><text x="238" y="82" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">A safe place for real work</text>
<text x="238" y="97.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Supportive and free of</text><text x="238" y="110.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">judgment, at a pace your</text><text x="238" y="124.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">system can sustain.</text>
<rect x="412" y="68" width="3" height="52" fill="#9BC4BD"/><text x="422" y="82" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">Structure you can measure</text>
<text x="422" y="97.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Assessment, targeted practices</text><text x="422" y="110.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">and weekly measurement.</text>
<rect x="228" y="144" width="3" height="52" fill="#9BC4BD"/><text x="238" y="158" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">Tools that fit your day</text>
<text x="238" y="173.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Five to twenty minute</text><text x="238" y="186.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">practices that stack into your</text><text x="238" y="200.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">schedule.</text>
<rect x="412" y="144" width="3" height="52" fill="#9BC4BD"/><text x="422" y="158" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">Body and mind together</text>
<text x="422" y="173.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Where physiology, emotion and</text><text x="422" y="186.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">thinking meet.</text>
<rect x="228" y="220" width="3" height="52" fill="#9BC4BD"/><text x="238" y="234" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">Alongside your other support</text>
<text x="238" y="249.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Never replaces medical or</text><text x="238" y="262.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">mental health care.</text>
<rect x="412" y="220" width="3" height="52" fill="#9BC4BD"/><text x="422" y="234" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.5" fill="#103C41">Direct and compassionate</text>
<text x="422" y="249.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">Clear about what the work</text><text x="422" y="262.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">asks, kind about how hard</text><text x="422" y="276.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="10.5" fill="#24211D">change is.</text>

<text x="40" y="342" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="10" fill="#9BC4BD" letter-spacing="1">WHAT WE DO</text>
<text x="40" y="362" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12" fill="#FEFCF8">Soma-Q is a nervous system alignment practice. We train</text><text x="40" y="378" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12" fill="#FEFCF8">high-performing leaders to notice stress sooner, shift</text><text x="40" y="394" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="12" fill="#FEFCF8">in the moment and recover faster.</text>
