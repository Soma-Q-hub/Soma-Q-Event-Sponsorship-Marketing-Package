<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Men's track poster: Stay steady when there is nothing to solve</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file 24.25 x 36.25 in (0.125 in bleed). Units 0.01 in. Keep text 1.5 in inside the file edge. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#EEEADD"/>
<polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">NERVOUS SYSTEM LITERACY</text>
<text x="175" y="560" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">Stay steady when</text>
<text x="175" y="738" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">there is nothing</text>
<text x="175" y="916" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">to solve.</text>
<text x="175" y="1090" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">You were taught to be the one who figures it out. That is a real</text>
<text x="175" y="1160" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">strength, and under pressure it can become a loop: the mind keeps</text>
<text x="175" y="1230" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">working while the body keeps running its alarm.</text>
<rect x="175" y="1400" width="995" height="600" rx="50" fill="#FEFCF8" stroke="#103C41" stroke-width="8"/>
<text letter-spacing="9" x="245" y="1520" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="54" fill="#103C41">THE MIND</text>
<polygon points="245,1650 275,1598 305,1650" fill="#103C41"/><text x="345" y="1650" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Analyzing</text>
<polygon points="245,1740 275,1688 305,1740" fill="#103C41"/><text x="345" y="1740" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Comparing</text>
<polygon points="245,1830 275,1778 305,1830" fill="#103C41"/><text x="345" y="1830" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Planning the fix</text>
<polygon points="245,1920 275,1868 305,1920" fill="#103C41"/><text x="345" y="1920" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Looking for what is wrong</text>
<rect x="1255" y="1400" width="995" height="600" rx="50" fill="#FEFCF8" stroke="#103C41" stroke-width="8"/>
<text letter-spacing="9" x="1325" y="1520" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="54" fill="#103C41">THE BODY</text>
<polygon points="1325,1650 1355,1598 1385,1650" fill="#103C41"/><text x="1425" y="1650" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Jaw set</text>
<polygon points="1325,1740 1355,1688 1385,1740" fill="#103C41"/><text x="1425" y="1740" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Chest tight</text>
<polygon points="1325,1830 1355,1778 1385,1830" fill="#103C41"/><text x="1425" y="1830" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Gut clenched</text>
<polygon points="1325,1920 1355,1868 1385,1920" fill="#103C41"/><text x="1425" y="1920" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="62" fill="#24211D">Shoulders braced</text>
<text x="1212" y="2130" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="58" fill="#103C41" font-style="italic">More thinking rarely settles what the body is still running.</text>
<line x1="175" y1="2260" x2="2250" y2="2260" stroke="#103C41" stroke-opacity=".28" stroke-width="8"/>
<text letter-spacing="9" x="250" y="2370" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="54" fill="#103C41">A DIFFERENT MOVE</text>
<circle cx="310" cy="2530" r="60" fill="#103C41"/><text x="310" y="2554" text-anchor="middle" font-family="DM Serif Display" font-size="70" fill="#FEFCF8">1</text>
<text x="400" y="2555" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="84" fill="#103C41">Locate it</text>
<text x="250" y="2680" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">Where is it in</text>
<text x="250" y="2746" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">your body?</text>
<circle cx="1000" cy="2530" r="60" fill="#103C41"/><text x="1000" y="2554" text-anchor="middle" font-family="DM Serif Display" font-size="70" fill="#FEFCF8">2</text>
<text x="1090" y="2555" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="84" fill="#103C41">Describe it</text>
<text x="940" y="2680" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">Heat, pressure,</text>
<text x="940" y="2746" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">tightness, buzzing?</text>
<circle cx="1690" cy="2530" r="60" fill="#103C41"/><text x="1690" y="2554" text-anchor="middle" font-family="DM Serif Display" font-size="70" fill="#FEFCF8">3</text>
<text x="1780" y="2555" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="84" fill="#103C41">Settle it</text>
<text x="1630" y="2680" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">Feet on the floor,</text>
<text x="1630" y="2746" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="52" fill="#24211D">one slow exhale.</text>
<text x="1212" y="2880" text-anchor="middle" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#103C41" font-style="italic">You still solve the problem. You solve it from steady, not from alarm.</text>
{{FOOTER:light}}
</svg></body></html>
