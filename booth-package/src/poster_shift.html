<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: The Soma-Q Shift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file 24.25 x 36.25 in (0.125 in bleed). Units 0.01 in. Keep text 1.5 in inside the file edge. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#E4F2F2"/>
<polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">THE SOMA-Q SHIFT</text>
<text x="175" y="560" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">Choose your response</text>
<text x="175" y="738" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">instead of reacting.</text>
<text x="175" y="960" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Three questions, asked in order. Each one keeps pressure from running the moment.</text>
<rect x="175" y="1130" width="2075" height="540" rx="50" fill="#FEFCF8" stroke="#103C41" stroke-width="8"/>
<circle cx="440" cy="1400" r="145" fill="#103C41"/><text x="440" y="1448" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">1</text>
<text x="670" y="1280" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="118" fill="#103C41">Notice</text>
<text x="670" y="1385" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="60" fill="#24211D">What just got activated?</text>
<text x="670" y="1465" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="50" fill="#24211D">Meet it with curiosity, not judgment.</text>
<text x="670" y="1570" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#103C41" font-style="italic">Catch it early, before it becomes a reaction.</text>
<rect x="175" y="1730" width="2075" height="540" rx="50" fill="#FEFCF8" stroke="#103C41" stroke-width="8"/>
<circle cx="440" cy="2000" r="145" fill="#103C41"/><text x="440" y="2048" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">2</text>
<text x="670" y="1880" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="118" fill="#103C41">Locate</text>
<text x="670" y="1985" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="60" fill="#24211D">Where do I feel it in my body?</text>
<text x="670" y="2065" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="50" fill="#24211D">Chest, throat, belly, jaw, shoulders, legs.</text>
<text x="670" y="2170" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#103C41" font-style="italic">Find the signal while it is still small.</text>
<rect x="175" y="2330" width="2075" height="540" rx="50" fill="#FEFCF8" stroke="#103C41" stroke-width="8"/>
<circle cx="440" cy="2600" r="145" fill="#103C41"/><text x="440" y="2648" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">3</text>
<text x="670" y="2480" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="118" fill="#103C41">Choose</text>
<text x="670" y="2585" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="60" fill="#24211D">What helps me stay with myself right now?</text>
<text x="670" y="2665" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="50" fill="#24211D">Slow exhale, orient, pause, return to the body.</text>
<text x="670" y="2770" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="52" fill="#103C41" font-style="italic">Come back to steady, then decide.</text>
<text x="175" y="3020" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="42" fill="#103C41" font-style="italic">The goal is not to stop the thought. The goal is to recognize the pattern of activation,</text>
<text x="175" y="3074" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="42" fill="#103C41" font-style="italic">meet it with curiosity, allow it, and shift.</text>
{{FOOTER:light}}
</svg></body></html>
