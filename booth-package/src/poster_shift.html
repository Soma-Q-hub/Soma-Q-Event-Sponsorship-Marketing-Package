<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: The Shift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file at 24.25 x 36.25 in (0.125 in bleed). Drawn in units of 0.01 in. Keep text 1.5 in inside the file edge.
   Print at FedEx, Staples or any poster printer; confirm their size and bleed requirements first. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
text { font-kerning: normal; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#103C41"/>
<polygon points="2425,0 2425,900 1500,0" fill="#9BC4BD" fill-opacity=".10"/>
<g><polygon points="175,330 209,270 243,330" fill="#9BC4BD"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#9BC4BD">THE SOMA-Q SHIFT</text></g>
<text x="175" y="570" font-family="DM Serif Display" font-size="186" fill="#FEFCF8">Three questions turn</text>
<text x="175" y="775" font-family="DM Serif Display" font-size="186" fill="#FEFCF8">a reaction into</text>
<text x="175" y="980" font-family="DM Serif Display" font-size="186" fill="#FEFCF8">a choice.</text>
<rect x="175" y="1330" width="2075" height="480" rx="50" fill="#FEFCF8"/>
<circle cx="460" cy="1570" r="150" fill="#103C41"/><text x="460" y="1615" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">1</text>
<text x="700" y="1500" font-family="DM Serif Display" font-size="120" fill="#103C41">Notice</text>
<text x="700" y="1620" font-family="DM Sans" font-weight="700" font-size="62" fill="#24211D">What just got activated?</text>
<text x="700" y="1705" font-family="DM Sans" font-size="52" fill="#24211D">Meet it with curiosity, not judgment.</text>
<polygon points="1152,1818 1272,1818 1212,1872" fill="#9BC4BD"/>
<rect x="175" y="1890" width="2075" height="480" rx="50" fill="#FEFCF8"/>
<circle cx="460" cy="2130" r="150" fill="#103C41"/><text x="460" y="2175" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">2</text>
<text x="700" y="2060" font-family="DM Serif Display" font-size="120" fill="#103C41">Locate</text>
<text x="700" y="2180" font-family="DM Sans" font-weight="700" font-size="62" fill="#24211D">Where do I feel it in my body?</text>
<text x="700" y="2265" font-family="DM Sans" font-size="52" fill="#24211D">Chest, throat, belly, jaw, shoulders, legs.</text>
<polygon points="1152,2378 1272,2378 1212,2432" fill="#9BC4BD"/>
<rect x="175" y="2450" width="2075" height="480" rx="50" fill="#FEFCF8"/>
<circle cx="460" cy="2690" r="150" fill="#103C41"/><text x="460" y="2735" text-anchor="middle" font-family="DM Serif Display" font-size="150" fill="#FEFCF8">3</text>
<text x="700" y="2620" font-family="DM Serif Display" font-size="120" fill="#103C41">Choose</text>
<text x="700" y="2740" font-family="DM Sans" font-weight="700" font-size="62" fill="#24211D">What helps me stay with myself right now?</text>
<text x="700" y="2825" font-family="DM Sans" font-size="52" fill="#24211D">Slow exhale, orient, pause, return to the body.</text>
<text x="175" y="3055" font-family="DM Serif Display" font-style="italic" font-size="56" fill="#9BC4BD">The goal is not to stop the thought. The goal is to recognize</text>
<text x="175" y="3125" font-family="DM Serif Display" font-style="italic" font-size="56" fill="#9BC4BD">the pattern of activation, meet it with curiosity, allow it, and shift.</text>
{{FOOTER:dark}}
</svg></body></html>
