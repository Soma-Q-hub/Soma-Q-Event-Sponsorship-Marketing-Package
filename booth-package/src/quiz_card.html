<text x="40" y="124" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="31" fill="#FEFCF8">Burnout Signal Check</text>

<rect x="58" y="249.90000000000003" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="258.40000000000003" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Several years or more</text>
<circle cx="52" cy="285.20000000000005" r="11" fill="#103C41"/><text x="52" y="289.20000000000005" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">2</text><text x="72" y="289.20000000000005" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.6" fill="#103C41">What is your body telling you?</text>
<text x="535" y="289.20000000000005" text-anchor="end" font-family="DM Sans" font-weight="400" font-size="8.2" fill="#5C5A53">Tick all that apply.</text>
<rect x="58" y="297.70000000000005" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="306.20000000000005" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Tension I cannot release in my jaw, shoulders, or chest</text>
<rect x="58" y="317.50000000000006" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="326.00000000000006" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Exhaustion that sleep does not fix</text>
<text x="535" y="326.00000000000006" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="9.6" fill="#9BC4BD">▲</text>
<rect x="58" y="337.30000000000007" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="345.80000000000007" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Wired and restless. I cannot power down</text>
<rect x="58" y="357.1000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="365.6000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Numb. I do not feel much of anything anymore</text>
<text x="535" y="365.6000000000001" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="9.6" fill="#9BC4BD">▲</text>
<rect x="58" y="376.9000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="385.4000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">None of these</text>
<circle cx="52" cy="412.2000000000001" r="11" fill="#103C41"/><text x="52" y="416.2000000000001" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">3</text><text x="72" y="416.2000000000001" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.6" fill="#103C41">What is happening in your thinking mind?</text>
<text x="535" y="416.2000000000001" text-anchor="end" font-family="DM Sans" font-weight="400" font-size="8.2" fill="#5C5A53">Tick all that apply.</text>
<rect x="58" y="424.7000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="433.2000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Brain fog. Thoughts feel slow and scattered</text>
<rect x="58" y="444.5000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="453.0000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Racing thoughts I cannot quiet</text>
<rect x="58" y="464.3000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="472.8000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Simple decisions feel heavy</text>
<rect x="58" y="484.10000000000014" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="492.60000000000014" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">I am in the room, but I am not present</text>
<rect x="58" y="503.9000000000001" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="512.4000000000001" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">None of these</text>
<circle cx="52" cy="539.2" r="11" fill="#103C41"/><text x="52" y="543.2" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">4</text><text x="72" y="543.2" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.6" fill="#103C41">What is happening underneath?</text>
<text x="535" y="543.2" text-anchor="end" font-family="DM Sans" font-weight="400" font-size="8.2" fill="#5C5A53">Tick all that apply.</text>
<rect x="58" y="551.7" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="560.2" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Emotionally flat. Things that used to matter do not land</text>
<rect x="58" y="571.5" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="580.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Reactive. Irritation surfaces faster than it should</text>
<rect x="58" y="591.3" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="599.8" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Going through the motions</text>
<rect x="58" y="611.0999999999999" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="619.5999999999999" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">I have lost the thread of who I am outside of performing</text>
<text x="535" y="619.5999999999999" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="9.6" fill="#9BC4BD">★</text>
<rect x="58" y="630.8999999999999" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="639.3999999999999" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">None of these</text>
<circle cx="52" cy="666.1999999999998" r="11" fill="#103C41"/><text x="52" y="670.1999999999998" text-anchor="middle" font-family="DM Serif Display" font-size="14" fill="#FEFCF8">5</text><text x="72" y="670.1999999999998" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="11.6" fill="#103C41">How much access do you have to your full energy, clarity, and joy?</text>
<text x="535" y="670.1999999999998" text-anchor="end" font-family="DM Sans" font-weight="400" font-size="8.2" fill="#5C5A53">Tick one.</text>
<rect x="58" y="678.6999999999998" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="687.1999999999998" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">Most days, I can still get there</text>
<rect x="58" y="698.4999999999998" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="706.9999999999998" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">It comes and goes</text>
<rect x="58" y="718.2999999999997" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="726.7999999999997" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">It is mostly offline</text>
<text x="535" y="726.7999999999997" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="9.6" fill="#9BC4BD">◆</text>
<rect x="58" y="738.0999999999997" width="9" height="9" rx="2" fill="none" stroke="#103C41" stroke-width="1.1"/><text x="76" y="746.5999999999997" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#24211D">I cannot remember the last time I had full access</text>
<text x="535" y="746.5999999999997" text-anchor="end" font-family="DM Sans" font-weight="700" font-size="9.6" fill="#9BC4BD">★ ◆</text>
<text x="287.5" y="846" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="8.6" fill="#103C41">Turn over for your result.   Not a diagnosis: a conversation starter.</text>

<div class="pg"><svg class="qz" viewBox="0 0 575 875" xmlns="http://www.w3.org/2000/svg"><rect width="575" height="875" fill="#EEEADD"/><text x="40" y="70" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41" letter-spacing="2.6">YOUR RESULT</text>
<text x="40" y="116" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="27" fill="#103C41">Follow the steps in order.</text><text x="40" y="148" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="27" fill="#103C41">Stop at your first yes.</text>
<rect x="40" y="180" width="495" height="142" rx="16" fill="#103C41"/><circle cx="68" cy="210" r="14" fill="#FEFCF8"/><text x="68" y="216" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#103C41">1</text><text x="92" y="216" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="19" fill="#FEFCF8">Long-term Dysregulation</text>
<text x="58" y="246" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="9.8" fill="#FEFCF8">Did you tick “Several years or more” in question 1,</text><text x="58" y="260" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="9.8" fill="#FEFCF8">AND any answer marked ★?</text>
<text x="58" y="284" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#FEFCF8">Years of chronic dysregulation. The pattern has started to feel like who you are.</text>
<text x="58" y="306" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#9BC4BD">Energy: running low   ·   Clarity: often clouded   ·   Joy: hard to reach</text>
<rect x="40" y="334" width="495" height="142" rx="16" fill="#E4F2F2"/><circle cx="68" cy="364" r="14" fill="#103C41"/><text x="68" y="370" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#E4F2F2">2</text><text x="92" y="370" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="19" fill="#103C41">Chronic Dysregulation</text>
<text x="58" y="400" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="9.8" fill="#103C41">Not step 1, but: did you tick “1 to 2 years” or “Several years or more”?</text><text x="58" y="414" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="9.8" fill="#103C41">OR a ▲ answer in question 2 together with a ◆ answer in question 5?</text>
<text x="58" y="438" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#103C41">Your system has been in survival mode for months to years, and it has become the baseline.</text>
<text x="58" y="460" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41">Energy: depleted   ·   Clarity: fragmented   ·   Joy: offline</text>
<rect x="40" y="488" width="495" height="142" rx="16" fill="#FEFCF8"/><circle cx="68" cy="518" r="14" fill="#103C41"/><text x="68" y="524" text-anchor="middle" font-family="DM Serif Display" font-size="17" fill="#FEFCF8">3</text><text x="92" y="524" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="19" fill="#103C41">Early Dysregulation</text>
<text x="58" y="554" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="9.8" fill="#103C41">None of the above?</text>
<text x="58" y="578" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.6" fill="#103C41">Early signals are present and your system still has capacity. A good time to act, before patterns deepen.</text>
<text x="58" y="600" text-anchor="start" font-family="DM Sans" font-weight="700" font-size="8.8" fill="#103C41">Energy: strained   ·   Clarity: interrupted   ·   Joy: dimming</text>
<rect x="40" y="642" width="495" height="160" rx="16" fill="#103C41"/><rect x="60" y="667" width="110" height="110" rx="7.7" fill="#FFFFFF" stroke="#103C41" stroke-width="1.3"/><svg x="69.9" y="676.9" width="90.2" height="90.2">{{QR_CALL}}</svg>
<text x="190" y="698" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">Book a free</text><text x="190" y="726" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="24" fill="#FEFCF8">discovery call.</text>
<text x="190" y="754.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.4" fill="#E4F2F2">Whatever your result, a conversation is the</text><text x="190" y="767.5" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.4" fill="#E4F2F2">next step. We look at what pressure is costing</text><text x="190" y="781.0" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="9.4" fill="#E4F2F2">you and match you to the right level of support.</text>
<text x="40" y="846" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="6.9" fill="#5C5A53">Soma-Q is an education and training practice. It does not diagnose, treat, or manage any condition. This check is not a medical or psychological measure.</text>
