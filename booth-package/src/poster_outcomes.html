<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: What changes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file at 24.25 x 36.25 in (0.125 in bleed). Drawn in units of 0.01 in. Keep text 1.5 in inside the file edge.
   Print at FedEx, Staples or any poster printer; confirm their size and bleed requirements first. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
text { font-kerning: normal; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#E4F2F2"/>
<g><polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">WHAT CHANGES</text></g>
<text x="175" y="570" font-family="DM Serif Display" font-size="186" fill="#103C41">What this work</text>
<text x="175" y="775" font-family="DM Serif Display" font-size="186" fill="#103C41">is built to restore.</text>
<text x="175" y="1010" font-family="DM Sans" font-size="58" fill="#24211D">The three outcomes this work is designed to build, and to hold under pressure.</text>
<circle cx="1212" cy="1800" r="470" fill="#103C41" fill-opacity=".92"/>
<circle cx="900" cy="2290" r="470" fill="#9BC4BD" fill-opacity=".92"/>
<circle cx="1525" cy="2290" r="470" fill="#FEFCF8" fill-opacity=".92" stroke="#103C41" stroke-width="8"/>
<text x="1212" y="1640" text-anchor="middle" font-family="DM Serif Display" font-size="104" fill="#FEFCF8">Restored</text>
<text x="1212" y="1755" text-anchor="middle" font-family="DM Serif Display" font-size="104" fill="#FEFCF8">energy</text>
<text x="690" y="2400" text-anchor="middle" font-family="DM Serif Display" font-size="104" fill="#103C41">Focused</text>
<text x="690" y="2515" text-anchor="middle" font-family="DM Serif Display" font-size="104" fill="#103C41">clarity</text>
<text x="1655" y="2400" text-anchor="middle" font-family="DM Serif Display" font-size="98" fill="#103C41">Joy and</text>
<text x="1655" y="2515" text-anchor="middle" font-family="DM Serif Display" font-size="98" fill="#103C41">fulfillment</text>
<text x="420" y="3010" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="50" fill="#103C41">Energy that returns,</text><text x="420" y="3072" text-anchor="middle" font-family="DM Sans" font-size="50" fill="#24211D">not just a day off.</text>
<text x="1212" y="3010" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="50" fill="#103C41">Thinking straight</text><text x="1212" y="3072" text-anchor="middle" font-family="DM Sans" font-size="50" fill="#24211D">when decisions land.</text>
<text x="2005" y="3010" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="50" fill="#103C41">Present in the work</text><text x="2005" y="3072" text-anchor="middle" font-family="DM Sans" font-size="50" fill="#24211D">and the people in it.</text>
{{FOOTER:light}}
</svg></body></html>
