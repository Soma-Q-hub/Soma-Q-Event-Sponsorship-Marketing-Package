<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Poster: What changes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Poster 24 x 36 in trim, file 24.25 x 36.25 in (0.125 in bleed). Units 0.01 in. Keep text 1.5 in inside the file edge. */
@page { size: 24.25in 36.25in; margin: 0; }
html, body { margin: 0; padding: 0; width: 24.25in; height: 36.25in; overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
svg.page { display: block; width: 24.25in; height: 36.25in; }
</style></head><body>
<svg class="page" viewBox="0 0 2425 3625" xmlns="http://www.w3.org/2000/svg">
<rect width="2425" height="3625" fill="#EEEADD"/>
<polygon points="175,330 209,270 243,330" fill="#103C41"/><text x="275" y="330" font-family="DM Sans" font-weight="700" font-size="56" letter-spacing="9" fill="#103C41">WHAT CHANGES</text>
<text x="175" y="560" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">What this work is</text>
<text x="175" y="738" text-anchor="start" font-family="DM Serif Display" font-weight="400" font-size="176" fill="#103C41">built to restore.</text>
<text x="175" y="960" text-anchor="start" font-family="DM Sans" font-weight="400" font-size="56" fill="#24211D">Three outcomes, held under pressure and lasting after the work ends.</text>
<g transform="translate(262,1120) scale(.99)">{{OUTCOMES:light}}</g>
<text x="430" y="2990" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="48" fill="#103C41">Energy that returns,</text>
<text x="430" y="3050" text-anchor="middle" font-family="DM Sans" font-weight="400" font-size="48" fill="#24211D">not just a day off.</text>
<text x="1212" y="2990" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="48" fill="#103C41">Thinking straight</text>
<text x="1212" y="3050" text-anchor="middle" font-family="DM Sans" font-weight="400" font-size="48" fill="#24211D">when decisions land.</text>
<text x="2000" y="2990" text-anchor="middle" font-family="DM Sans" font-weight="700" font-size="48" fill="#103C41">Present in the work</text>
<text x="2000" y="3050" text-anchor="middle" font-family="DM Sans" font-weight="400" font-size="48" fill="#24211D">and the people in it.</text>
{{FOOTER:light}}
</svg></body></html>
